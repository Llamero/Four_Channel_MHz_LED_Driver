name=DAC80501
version=1.0.0
author=Custom
maintainer=Custom
sentence=Driver for the Texas Instruments DAC80501ZDGSR 16-bit SPI voltage-output DAC, fixed for VDD=3.3V and a 0-2.5V output range from the internal reference.
paragraph=Implements the SPI write protocol, fixed GAIN register configuration (REF-DIV=1, BUFF-GAIN=1 for a valid 2.5V full-scale range at 3.3V supply), CONFIG/SYNC/TRIGGER registers, software reset, and voltage<->code conversion for the DAC80501. Note that this part has no SPI readback path; DEVID/STATUS are only readable in I2C mode.
category=Signal Input/Output
url=https://www.ti.com/lit/ds/symlink/dac80501.pdf
architectures=*
includes=DAC80501.h
depends=SPI
